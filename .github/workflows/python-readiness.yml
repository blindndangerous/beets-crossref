name: python readiness

# Weekly: when a newer stable CPython than the test matrix's newest installs
# the project and its test extra from wheels, open one issue saying so.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check the newest stable Python
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/python_readiness.py
