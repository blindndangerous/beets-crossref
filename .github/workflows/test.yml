name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov upload through OIDC; no token secret
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Python and the newest one that beets and every
        # locked dependency install on from wheels. python-readiness.yml
        # opens an issue when a newer one is ready.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra test
      - name: Test
        run: uv run pytest -q --cov --cov-report=xml
      - name: Lint
        run: uv run ruff check beetsplug tests
      # Informational only: a Codecov outage or a fork without OIDC never
      # fails the job.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
