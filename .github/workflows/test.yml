name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Import the plugin against the real dependencies
        # The suite runs on stubs, so a broken import of beets, spotipy or
        # requests would otherwise reach a user before CI.
        run: python -c "import beetsplug.spotify_album_match"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check beetsplug tests
