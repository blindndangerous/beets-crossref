[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-spotify-album-match"
version = "0.2.0"
description = "Beets plugin that matches local albums and tracks to Spotify."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "blindndangerous" },
]

dependencies = [
    "beets>=2.2",
    "spotipy>=2.22",
    "thefuzz>=0.20",
    "requests>=2.25",
]

[project.urls]
Homepage = "https://github.com/blindndangerous/beets-spotify-album-match"
Source = "https://github.com/blindndangerous/beets-spotify-album-match"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["beetsplug*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Nested with-blocks in the tests name one patch per line; collapsing them
# into a single statement makes the mock stacks harder to read.
"tests/*" = ["SIM117"]
