[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-spotify-album-match"
version = "0.2.0"
description = "Beets plugin that matches local albums and tracks to Spotify."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "blindndangerous" },
]
dependencies = [
    "beets>=1.6",
    "spotipy>=2.22",
    "cachetools>=5",
    "thefuzz>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["beetsplug*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
